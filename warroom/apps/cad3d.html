<title>2D 轉 3D 換件示範</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<style>
  :root{
    --bg:#0c1a29;
    --bg-panel:#13263c;
    --bg-panel-soft:#0f2033;
    --line:#274863;
    --line-soft:#1a3349;
    --text:#eaf1f7;
    --text-muted:#8fa9c2;
    --accent:#d7a75c;
    --accent-strong:#f0c383;
    --accent-soft:rgba(215,167,92,0.16);
    --ok:#7fc8a9;
    --ok-soft:rgba(127,200,169,0.12);
    --warn:#e6b45c;
    --warn-soft:rgba(230,180,92,0.12);
    --tag-bg:rgba(12,26,41,0.86);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
    overflow:hidden;
    background-image:
      repeating-linear-gradient(0deg, var(--line-soft) 0px, var(--line-soft) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, var(--line-soft) 0px, var(--line-soft) 1px, transparent 1px, transparent 40px);
  }
  [hidden]{display:none!important;}

  #canvas-wrap{position:fixed; inset:0; z-index:0;}
  canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab;}
  canvas:active{cursor:grabbing;}

  #labels{position:fixed; inset:0; z-index:2; pointer-events:none; overflow:hidden;}
  .tag{position:absolute; left:0; top:0; display:flex; align-items:center; gap:6px; white-space:nowrap; opacity:0; will-change:transform,opacity;}
  .tag i{flex:none; width:7px; height:7px; border-radius:50%; background:var(--accent-strong); box-shadow:0 0 0 3px rgba(215,167,92,0.28);}
  .tag span{font:500 11px/1 'IBM Plex Sans','Noto Sans TC',sans-serif; color:var(--text); background:var(--tag-bg); border:1px solid var(--line); border-radius:2px; padding:4px 6px;}

  #ui{
    position:fixed; inset:0; z-index:5;
    padding:calc(18px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px));
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,320px);
    grid-template-rows:auto minmax(0,1fr) auto;
    gap:14px;
    pointer-events:none;
  }
  #ui > *{pointer-events:auto;}

  .panel{background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-soft)); border:1px solid var(--line); border-radius:3px;}
  .eyebrow{font:500 11px/1 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:0 0 6px;}

  .titleblock{grid-column:1; grid-row:1; align-self:start; justify-self:start; padding:12px 16px; max-width:460px;}
  .titleblock h1{font-family:'Big Shoulders Display',sans-serif; font-weight:700; font-size:clamp(22px,4vw,30px); line-height:1; margin:0 0 6px; text-wrap:balance;}
  .titleblock p{margin:0 0 10px; font-size:12.5px; line-height:1.55; color:var(--text-muted);}
  .specs{display:grid; grid-template-columns:auto 1fr; gap:2px 14px; margin:0; font:400 11px/1.75 'IBM Plex Mono','Noto Sans TC',monospace; color:var(--text-muted);}
  .specs dd{margin:0; color:var(--text); font-variant-numeric:tabular-nums;}

  .swap{grid-column:2; grid-row:1 / 3; align-self:start; max-height:100%; min-height:0; overflow:auto; padding:12px 14px 10px;}
  .status{font-size:12px; line-height:1.5; padding:7px 9px; border:1px solid var(--line); border-radius:3px; margin:0 0 4px;}
  .status[data-kind="preset"]{border-color:rgba(127,200,169,0.45); background:var(--ok-soft); color:var(--ok);}
  .status[data-kind="mix"]{border-color:rgba(230,180,92,0.45); background:var(--warn-soft); color:var(--warn);}
  .status ul{margin:4px 0 0; padding-left:16px;}
  .slot{display:grid; gap:6px; padding:10px 0 2px; border-top:1px solid var(--line-soft); margin-top:8px;}
  .slot h3{margin:0; display:flex; justify-content:space-between; align-items:baseline; gap:8px; font:600 12.5px/1.3 'IBM Plex Sans','Noto Sans TC',sans-serif;}
  .slot h3 small{font:400 10.5px/1.3 'IBM Plex Mono','Noto Sans TC',monospace; color:var(--warn);}
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  button.opt{
    appearance:none; text-align:left; cursor:pointer;
    display:grid; gap:3px; align-content:start;
    background:var(--bg-panel-soft); color:var(--text-muted);
    border:1px solid var(--line); border-radius:3px; padding:7px 9px;
    font:400 12px/1.35 'IBM Plex Sans','Noto Sans TC',sans-serif;
    transition:border-color .15s, background .15s;
  }
  button.opt .m{font:500 9.5px/1 'IBM Plex Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted);}
  button.opt b{font-weight:500; color:var(--text);}
  button.opt code{font:400 10.5px/1.3 'IBM Plex Mono',monospace; color:var(--text-muted); overflow-wrap:anywhere;}
  button.opt:hover{border-color:var(--accent);}
  button.opt:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  button.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft);}
  button.opt[aria-pressed="true"] b, button.opt[aria-pressed="true"] .m{color:var(--accent-strong);}
  .foot{margin:12px 0 0; font:400 10.5px/1.6 'IBM Plex Mono','Noto Sans TC',monospace; color:var(--text-muted);}

  .controls{grid-column:1; grid-row:3; align-self:end; justify-self:start; max-width:100%; display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px;}
  .panel-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; cursor:move; user-select:none; touch-action:none;}
  .info{cursor:move; touch-action:none;}
  .info h2, .info .pn, .info .note{cursor:auto;}
  button.fold{
    appearance:none; flex:none; cursor:pointer;
    border:1px solid var(--line); border-radius:3px; background:transparent; color:var(--text-muted);
    font:500 11px/1 'IBM Plex Sans','Noto Sans TC',sans-serif; padding:6px 9px;
  }
  button.fold:hover{color:var(--text); border-color:var(--accent);}
  button.fold:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  button.fold[aria-expanded="false"]{color:var(--accent-strong); border-color:rgba(215,167,92,0.5);}
  #title-body{margin-top:2px;}
  .group{display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; background:var(--bg-panel-soft); width:max-content; max-width:100%;}
  .group.primary{border-color:var(--accent);}
  button.seg{
    appearance:none; border:0; background:transparent; color:var(--text-muted);
    font:500 12px/1 'IBM Plex Sans','Noto Sans TC',sans-serif;
    padding:9px 13px; cursor:pointer; border-right:1px solid var(--line); white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .group.primary button.seg{padding:11px 16px; font-size:13px; border-right-color:var(--accent);}
  button.seg:last-child{border-right:0;}
  button.seg:hover{color:var(--text);}
  button.seg:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  button.seg[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-strong);}
  .hint{flex-basis:100%; font:400 11px/1.5 'IBM Plex Mono','Noto Sans TC',monospace; color:var(--text-muted); opacity:.8; margin:0;}

  .info{grid-column:2; grid-row:3; align-self:end; padding:12px 14px; position:relative;}
  .info h2{margin:0 26px 2px 0; font:600 15px/1.35 'IBM Plex Sans','Noto Sans TC',sans-serif; text-wrap:balance;}
  .info .en{margin:0 0 8px; font:400 10.5px/1.4 'IBM Plex Mono',monospace; color:var(--text-muted);}
  .info .pn{display:inline-block; margin:0 0 8px; font:500 13px/1 'IBM Plex Mono',monospace; color:var(--accent-strong); background:var(--accent-soft); border:1px solid rgba(215,167,92,0.4); border-radius:2px; padding:5px 7px;}
  .info .meta{margin:0 0 6px; font-size:11.5px; color:var(--text-muted);}
  .info .note{margin:0; font-size:12px; line-height:1.55;}
  .info .est{margin:6px 0 0; font-size:11px; color:var(--warn);}
  .info button.close{position:absolute; top:6px; right:6px; appearance:none; border:0; background:transparent; color:var(--text-muted); font-size:18px; line-height:1; width:28px; height:28px; cursor:pointer; border-radius:3px;}
  .info button.close:hover{color:var(--text);}
  .info button.close:focus-visible{outline:2px solid var(--accent);}

  @media (max-width: 760px){
    #ui{grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr) auto auto; gap:10px; padding-left:16px; padding-right:16px;}
    .titleblock{grid-column:1; grid-row:1; max-width:100%; padding:10px 12px;}
    .controls{grid-column:1; grid-row:2; align-self:start;}
    .hint{display:none;}
    .info{grid-column:1; grid-row:4;}
    .swap{grid-column:1; grid-row:5; max-height:36vh;}
    .tag span{font-size:10px; padding:3px 5px;}
  }
  @media (prefers-reduced-motion: reduce){
    button.seg, button.opt{transition:none;}
  }
</style>

<div id="canvas-wrap"></div>
<div id="labels"></div>

<div id="ui">
  <section class="titleblock panel" aria-labelledby="model-name">
    <div class="panel-head">

  </aside>

  <div class="controls">

      <button class="seg" id="shell-hide" aria-pressed="false">隱藏</button>

      <button class="seg" id="btn-assemble" aria-pressed="true">組合</button>
      <button class="seg" id="btn-explode" aria-pressed="false">拆解</button>
    </div>
    <div class="group" role="group" aria-label="視角">
      <button class="seg" id="view-iso" aria-pressed="true">立體</button>
      <button class="seg" id="view-front" aria-pressed="false">正視</button>
      <button class="seg" id="view-side" aria-pressed="false">側視</button>
      <button class="seg" id="view-back" aria-pressed="false">背面</button>
      <button class="seg" id="btn-rotate" aria-pressed="true">自動旋轉</button>
    </div>
    <p class="hint">拖曳旋轉・滾輪縮放・點零件看料號・文字框可拖曳移動（雙擊標題列復位）</p>
  </div>

  <section class="info panel" id="info" hidden aria-live="polite">
    <button class="close" id="info-close" aria-label="關閉零件資訊">×</button>
    <h2 id="info-zh"></h2>
    <p class="en" id="info-en"></p>
    <span class="pn" id="info-pn"></span>
    <p class="meta" id="info-meta"></p>
    <p class="note" id="info-note"></p>
    <p class="est" id="info-est" hidden>內部零件：尺寸與位置為示意，非實際量測。</p>
  </section>
</div>

    }

    document.getElementById("model-name").textContent = preset ? "示範" + DATA.models[preset].zh : "示範機型（混搭）";
    document.getElementById("spec-boiler").textContent = cfg.boiler === "SWN" ? "6L ×1" : "4L ×2（蒸氣＋熱水）";
    document.getElementById("spec-heater").textContent = cfg.boiler === "SWN" ? "1500W 110V ×1（法蘭式）" : "1500W ×2（旋入式）";
    document.getElementById("spec-control").textContent = cfg.panel === "SWN" ? "旋鈕式手動閥" : "4.3\" 觸控螢幕＋電磁閥";

    recs.forEach(function (r) { r.target = isActive(r.p) ? 1 : 0; });
    if (selected && !isActive(selected.p)) select(null);
  }

  MODEL_KEYS.forEach(function (m) {
    document.getElementById("model-" + m).addEventListener("click", function () {
      cfg = Object.assign({}, DATA.presets[m]);
      refresh();
    });
  });

  ["solid", "ghost", "hide"].forEach(function (mode) {
    document.getElementById("shell-" + mode).addEventListener("click", function () {
      shellMode = mode;
      ["solid", "ghost", "hide"].forEach(function (k) { document.getElementById("shell-" + k).setAttribute("aria-pressed", String(k === mode)); });
      if (selected && selected.p.shell && mode !== "solid") select(null);
    });
  });

  var btnAssemble = document.getElementById("btn-assemble"), btnExplode = document.getElementById("btn-explode");
  function setExploded(on) {
    explodeTarget = on ? 1 : 0;
    btnExplode.setAttribute("aria-pressed", String(on));
    btnAssemble.setAttribute("aria-pressed", String(!on));
  }
  btnExplode.addEventListener("click", function () { setExploded(true); });
  btnAssemble.addEventListener("click", function () { setExploded(false); });

  // ---------------- part info ----------------
  var info = document.getElementById("info");
  function select(rec) {
    if (selected) {
      selected.mats.forEach(function (m) { m.emissive.copy(m.userData.baseEmissive); });
      selected.edgeMats.forEach(function (m) { m.color.copy(ACCENT); });
    }
    selected = rec;
    if (!rec) { info.hidden = true; return; }
    rec.mats.forEach(function (m) { m.emissive.setHex(0x5a3d14); });
    rec.edgeMats.forEach(function (m) { m.color.copy(ACCENT_HOT); });
    var p = rec.p;
    document.getElementById("info-zh").textContent = p.zh;
    document.getElementById("info-en").textContent = p.en;
    document.getElementById("info-pn").textContent = p.pn;
    document.getElementById("info-meta").textContent = p.slot
      ? slotById[p.slot].zh + "・" + DATA.models[p.opt].zh + " 專用"
      : "機型 A／B 共用";
    document.getElementById("info-note").textContent = p.note || "";
    document.getElementById("info-note").hidden = !p.note;
    document.getElementById("info-est").hidden = !p.internal;
    info.hidden = false;
  }
  document.getElementById("info-close").addEventListener("click", function () { select(null); });
  window.addEventListener("keydown", function (ev) { if (ev.key === "Escape") select(null); });

  // ---------------- camera ----------------
  var VIEWS = {
    iso:   { theta: 0.78, phi: 1.2 },
    front: { theta: 0.0, phi: Math.PI / 2 - 0.001 },
    side:  { theta: Math.PI / 2, phi: Math.PI / 2 - 0.001 },
    back:  { theta: Math.PI + 0.78, phi: 1.2 }
  };
  var view = { theta: VIEWS.iso.theta, phi: VIEWS.iso.phi, dist: 175, target: new THREE.Vector3(0, H / 2, 0) };
  var zoom = 1, goal = null, fitScale = 5;

  function applyCamera() {
    var sp = Math.sin(view.phi);
    camera.position.set(view.target.x + view.dist * sp * Math.sin(view.theta),
                        view.target.y + view.dist * Math.cos(view.phi),
                        view.target.z + view.dist * sp * Math.cos(view.theta));
    camera.lookAt(view.target);
  }
  // keep the machine centred in the largest area the UI panels leave uncovered, and size it to fit there
  var uiEls = [document.querySelector(".titleblock"), document.querySelector(".swap"), document.querySelector(".controls"), info];
  function rectOf(elm) { return elm && !elm.hidden ? elm.getBoundingClientRect() : null; }
  function fitView() {
    var w = wrap.clientWidth, h = wrap.clientHeight, m = 12;
    var t = rectOf(uiEls[0]), s = rectOf(uiEls[1]), c = rectOf(uiEls[2]), inf = rectOf(uiEls[3]);
    var cands = [];
    function add(x0, x1, y0, y1) { if (x1 - x0 > 80 && y1 - y0 > 80) cands.push({ x0: x0, x1: x1, y0: y0, y1: y1 }); }
    if (w <= 760) {
      add(0, w, Math.max(t ? t.bottom : 0, c ? c.bottom : 0) + m, Math.min(s ? s.top : h, inf ? inf.top : h) - m);
    } else {
      var leftR = Math.max(t ? t.right : 0, c ? c.right : 0);
      var rightL = Math.min(s ? s.left : w, inf ? inf.left : w);
      var rightB = s ? s.bottom : 0;
      var infTop = inf ? inf.top : h;
      add(leftR + m, rightL - m, m, h - m);
      add(0, rightL - m, (t ? t.bottom : 0) + m, (c ? c.top : h) - m);
      add(leftR + m, w, rightB + m, infTop - m);
      add(0, w, Math.max(t ? t.bottom : 0, rightB) + m, Math.min(c ? c.top : h, infTop) - m);
    }
    var best = { x0: 0, x1: w, y0: 0, y1: h }, score = -1;
    cands.forEach(function (r) {
      var sc = Math.min(r.x1 - r.x0, r.y1 - r.y0);
      if (sc > score) { score = sc; best = r; }
    });
    var cx = (best.x0 + best.x1) / 2, cy = (best.y0 + best.y1) / 2;
    camera.setViewOffset(w, h, w / 2 - cx, h / 2 - cy, w, h);
    fitScale = h / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * Math.max(120, Math.min(best.x1 - best.x0, best.y1 - best.y0)));
  }
  var fitQueued = false;
  function scheduleFit() {
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(function () { fitQueued = false; fitView(); });
  }
  function resize() {
    var w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    fitView();
  }
  window.addEventListener("resize", resize);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(scheduleFit);
    uiEls.forEach(function (x) { if (x) ro.observe(x); });
  }

  function setupFold(btnId, bodyId, open) {
    var btn = document.getElementById(btnId), body = document.getElementById(bodyId);
    function apply(o) {
      body.hidden = !o;
      btn.setAttribute("aria-expanded", String(o));
      btn.textContent = o ? "收合" : "展開";
      scheduleFit();
    }
    btn.addEventListener("click", function () { apply(body.hidden); });
    apply(open);
  }
  setupFold("fold-title", "title-body", window.innerWidth >= 1280 && window.innerHeight >= 760);
  setupFold("fold-swap", "swap-body", window.innerWidth > 760);

  // panels can be dragged out of the way; double-click the header puts one back
  var drags = [];
  function makeDraggable(panel, handle) {
    if (!panel || !handle) return;
    var st = { x: 0, y: 0 };
    function clamp() {
      var r = panel.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
      var x0 = r.left - st.x, y0 = r.top - st.y;
      st.x = Math.min(Math.max(st.x, 8 - x0), Math.max(8 - x0, vw - 8 - r.width - x0));
      st.y = Math.min(Math.max(st.y, 8 - y0), Math.max(8 - y0, vh - 8 - r.height - y0));
      panel.style.transform = "translate(" + st.x.toFixed(1) + "px," + st.y.toFixed(1) + "px)";
    }
    st.clamp = clamp;
    drags.push(st);
    var dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
    handle.addEventListener("pointerdown", function (ev) {
      if (ev.target.closest("button, a, input, code")) return;
      dragging = true; sx = ev.clientX; sy = ev.clientY; ox = st.x; oy = st.y;
      handle.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    handle.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      st.x = ox + (ev.clientX - sx);
      st.y = oy + (ev.clientY - sy);
      clamp();
      scheduleFit();
    });
    function end() { if (dragging) { dragging = false; scheduleFit(); } }
    handle.addEventListener("pointerup", end);
    handle.addEventListener("pointercancel", end);
    handle.addEventListener("dblclick", function () {
      st.x = 0; st.y = 0;
      panel.style.transform = "";
      scheduleFit();
    });
  }
  makeDraggable(uiEls[0], uiEls[0] && uiEls[0].querySelector(".panel-head"));
  makeDraggable(uiEls[1], uiEls[1] && uiEls[1].querySelector(".panel-head"));
  makeDraggable(info, info);
  window.addEventListener("resize", function () { drags.forEach(function (d) { d.clamp(); }); });

  resize();

  var btnRotate = document.getElementById("btn-rotate");
  var viewBtns = {};
  Object.keys(VIEWS).forEach(function (k) { viewBtns[k] = document.getElementById("view-" + k); });
  function setRotate(on) { autoRotate = on; btnRotate.setAttribute("aria-pressed", String(on)); }
  function markView(name) { Object.keys(viewBtns).forEach(function (k) { viewBtns[k].setAttribute("aria-pressed", String(k === name)); }); }
  Object.keys(VIEWS).forEach(function (name) {
    viewBtns[name].addEventListener("click", function () {
      var t = VIEWS[name], twoPi = Math.PI * 2;
      goal = { theta: t.theta + Math.round((view.theta - t.theta) / twoPi) * twoPi, phi: t.phi };
      setRotate(false);
      markView(name);
    });
  });
  btnRotate.addEventListener("click", function () { setRotate(!autoRotate); if (autoRotate) markView(null); });
  if (reduceMotion) setRotate(false);

  var el = renderer.domElement, dragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
  el.addEventListener("pointerdown", function (ev) {
    dragging = true; goal = null;
    lastX = downX = ev.clientX; lastY = downY = ev.clientY;
    el.setPointerCapture(ev.pointerId);
  });
  el.addEventListener("pointermove", function (ev) {
    if (!dragging) return;
    view.theta -= (ev.clientX - lastX) * 0.005;
    view.phi = Math.min(Math.PI / 2 + 0.35, Math.max(0.25, view.phi - (ev.clientY - lastY) * 0.005));
    lastX = ev.clientX; lastY = ev.clientY;
    if (Math.abs(ev.clientX - downX) + Math.abs(ev.clientY - downY) > 5) markView(null);
  });
  el.addEventListener("pointercancel", function () { dragging = false; });
  var raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
  el.addEventListener("pointerup", function (ev) {
    dragging = false;
    if (Math.abs(ev.clientX - downX) + Math.abs(ev.clientY - downY) > 5) return;
    var rect = el.getBoundingClientRect();
    ndc.set(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(pickables, false);
    for (var i = 0; i < hits.length; i++) {
      var rec = byId[hits[i].object.userData.partId];
      if (rec.group.visible && rec.opacity > 0.3) { select(rec); return; }
    }
    select(null);
  });
  el.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    zoom = Math.min(2.6, Math.max(0.4, zoom * (1 + ev.deltaY * 0.001)));
  }, { passive: false });

  // ---------------- frame loop ----------------
  function updateLabels(e) {
    var w = wrap.clientWidth, h = wrap.clientHeight;
    var fade = Math.max(0, Math.min(1, (e - 0.55) / 0.35));
    camera.updateMatrixWorld();
    labels.forEach(function (l) {
      var r = l.rec;
      if (fade <= 0 || !r.group.visible || r.presence < 0.6 || r.opacity < 0.3) { l.el.style.opacity = "0"; return; }
      tmpBox.copy(r.box0).translate(r.group.position);
      tmpBox.getCenter(anchor);
      anchor.y = tmpBox.max.y;
      anchor.add(root.position).project(camera);
      if (anchor.z > 1 || anchor.z < -1) { l.el.style.opacity = "0"; return; }
      var x = (anchor.x + 1) / 2 * w, y = (1 - anchor.y) / 2 * h;
      l.el.style.transform = "translate(" + (x - 3.5).toFixed(1) + "px," + (y - 3.5).toFixed(1) + "px)";
      l.el.style.opacity = fade.toFixed(3);
    });
  }

  var clock = new THREE.Clock();
  function tick() {
    var delta = Math.min(clock.getDelta(), 0.05);
    mix = reduceMotion ? explodeTarget : mix + (explodeTarget - mix) * Math.min(1, delta * 3);
    var e = mix * mix * (3 - 2 * mix);
    var shellFactor = SHELL_FACTOR[shellMode];

    recs.forEach(function (r) {
      r.presence = reduceMotion ? r.target : r.presence + (r.target - r.presence) * Math.min(1, delta * 5);
      if (Math.abs(r.presence - r.target) < 0.002) r.presence = r.target;
      r.group.position.copy(r.offset).multiplyScalar(e).addScaledVector(r.swapDir, 1 - r.presence);
      var op = r.presence * (r.p.shell ? shellFactor : 1);
      r.opacity = op;
      var edgeOp = r.presence * (r.p.shell ? (shellMode === "hide" ? 0 : 0.5) : 0.45);
      r.group.visible = op > 0.01 || edgeOp > 0.01;
      r.mats.forEach(function (m) {
        m.opacity = op;
        m.transparent = op < 0.999;
        m.depthWrite = op > 0.5;
        m.visible = op > 0.01;
      });
      r.edgeMats.forEach(function (m) { m.opacity = r === selected ? 1 : edgeOp; });
    });

    if (goal) {
      var k = Math.min(1, delta * 4);
      view.theta += (goal.theta - view.theta) * k;
      view.phi += (goal.phi - view.phi) * k;
      if (Math.abs(goal.theta - view.theta) < 0.001 && Math.abs(goal.phi - view.phi) < 0.001) goal = null;
    } else if (autoRotate && !dragging) {
      view.theta += delta * 0.18;
    }
    view.target.z = 6 * e;
    view.dist = (42 + 22 * e) * fitScale * zoom;
    applyCamera();

    rise.uRiseY.value = rise.uRiseY.value > H + 12 ? -12 : rise.uRiseY.value + delta * 16;
    updateFlyers(reduceMotion ? 0 : delta, shellMode !== "hide");
    updateLabels(e);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  refresh();
  recs.forEach(function (r) { r.presence = r.target; });
  requestAnimationFrame(tick);
})();

</script>
