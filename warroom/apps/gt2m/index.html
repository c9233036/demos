<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方殼外觀機型示範</title>
<style>
  :root { --bg:#1d2126; --panel:#2a2f36; --fg:#e8e8e8; --muted:#9aa3ad; --acc:#c9a84c; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:"Microsoft JhengHei",Arial,sans-serif; overflow:hidden; }
  #c { width:100%; height:100%; display:block; }
  #ui { position:absolute; top:12px; left:12px; width:300px; max-height:calc(100vh - 24px); overflow-y:auto; box-sizing:border-box; background:var(--panel); padding:12px 14px; border-radius:8px; font-size:13px; line-height:1.6; box-shadow:0 2px 10px rgba(0,0,0,.4); }
  #ui h1 { font-size:15px; margin:0 0 6px; color:var(--acc); }
  #ui label { display:block; margin-top:8px; }
  #ui input[type=range] { width:100%; }
  #ui button { margin:6px 6px 0 0; padding:5px 10px; background:#3a414a; color:var(--fg); border:1px solid #555; border-radius:4px; cursor:pointer; font-size:12px; }
  #ui button:hover { border-color:var(--acc); }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:18px; pointer-events:none; }
  #info { margin-top:6px; color:var(--acc); min-height:18px; }
  #sheetBox { position:fixed; inset:0; z-index:20; background:rgba(10,12,15,.92); display:flex; flex-direction:column; }
  #sheetBox[hidden] { display:none; }
  #sheetBar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 14px; background:var(--panel); font-size:13px; }
  #sheetBar button { padding:5px 12px; background:#3a414a; color:var(--fg); border:1px solid #555; border-radius:4px; cursor:pointer; font-size:13px; }
  #sheetBar button:hover, #sheetBar button[aria-pressed="true"] { border-color:var(--acc); color:var(--acc); }
  #sheetBar .sp { flex:1; }
  #sheetWrap { flex:1; overflow:auto; padding:14px; text-align:center; }
  #sheet { max-width:100%; height:auto; background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.5); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">載入中…</div>
<div id="sheetBox" hidden role="dialog" aria-modal="true" aria-label="2D 圖">
  <div id="sheetBar">
    <button id="sh3v" aria-pressed="true">外觀三視圖</button>
    <button id="shTop" aria-pressed="false">內部配件 2D 上視圖</button>
    <span class="sp" id="sheetNote">依目前 3D 畫面的狀態（滑桿、隱藏零件、外殼）出圖</span>
    <button id="shPng">下載 PNG</button>
    <button id="shClose">關閉（回 3D）</button>
  </div>
  <div id="sheetWrap"><canvas id="sheet"></canvas></div>
</div>
<div id="ui">
  <h1>示範機型 整機 <span style="font-size:11px;color:#e0b25a;border:1px solid #e0b25a;border-radius:9px;padding:0 6px">示範・已去機敏</span></h1>
  <div>尺寸：<span id="size"></span> mm</div>
  <label>剖切高度（往下拉＝切掉上半部，看底座）
    <input id="cut" type="range" min="0" max="1000" value="1000"></label>
  <div>保留高度：<span id="cutv"></span></div>
  <label>剖切方向
    <select id="axis"><option value="1">由上往下（高度）</option><option value="0">由右往左</option><option value="2">由前往後</option></select></label>
  <label><input id="xray" type="checkbox"> 外殼半透明（大零件變透明）</label>
  <div>
    <button id="bBase">底座＋內部</button>
        <button id="bFit">重置視角</button>
  </div>
  <div>
    <button id="b3v">畫成三視圖</button>
    <button id="bTop2d">內部配件 2D 上視圖</button>
  </div>
  <div id="info"></div>
  <h1 style="margin-top:12px">方殼外觀（示範）</h1>
  <label><input id="woodOn" type="checkbox" checked> 外框四面包覆烤漆方殼（底緣坐在封底板上）</label>
  <label>外殼板厚度 <span id="vWt"></span><input id="wT" type="range" min="10" max="30" value="10"></label>
  <label>外殼底緣圓角 <span id="vWf"></span><input id="wF" type="range" min="0" max="17" value="2"></label>
  <label>四角轉角半徑：頂 <span id="vWct"></span><input id="wCt" type="range" min="20" max="120" value="22"></label>
  <label>四角轉角半徑：底 <span id="vWcb"></span><input id="wCb" type="range" min="20" max="200" value="22"></label>
  <label>前後斜度（底部往內收） <span id="vWb"></span><input id="wB" type="range" min="0" max="100" step="0.5" value="0"></label>
  <label>左右側斜度（底部往內收） <span id="vWs"></span><input id="wS" type="range" min="0" max="100" value="0"></label>
  <label>外殼往外距離：左右（負＝往內） <span id="vWo"></span><input id="wO" type="range" min="-10" max="30" step="0.5" value="30"></label>
  <label>外殼往外距離：前後（負＝往內） <span id="vWox"></span><input id="wOx" type="range" min="-30" max="30" step="0.5" value="30"></label>
  <label>電源旋鈕往外移（內部軸管加長） <span id="vKo"></span><input id="kOut" type="range" min="0" max="40" value="20"></label>
  <h1 style="margin-top:12px">底座改版</h1>
  <label><input id="redo" type="checkbox" checked> 套用新底座（取消＝看原本）</label>
  <label><input id="eOn" type="checkbox" checked> 兩端端板（底部裁到封底板上）</label>
  <label>不鏽鋼底盒長度 <span id="vLen"></span>
    <input id="sLen" type="range" min="200" max="880" value="394"></label>
  <label>不鏽鋼底盒高度 <span id="vH"></span>
    <input id="sH" type="range" min="10" max="77" value="77"></label>
  <label>內部零件往上移 <span id="vUp"></span>
    <input id="sUp" type="range" min="0" max="150" value="83"></label>
  <label>馬達組旋轉 <span id="vMot"></span>（負＝往左轉）
    <input id="motorRot" type="range" min="-180" max="180" step="1" value="0"></label>
  <label>馬達繞自身軸滾轉 <span id="vRoll"></span>（-90＝頂部朝右、底座朝左鎖豎板）
    <input id="motorRoll" type="range" min="-180" max="180" step="1" value="-90"></label>
  <label>泵頭繞馬達軸轉向 <span id="vPump"></span>
    <input id="pumpRoll" type="range" min="-180" max="180" step="5" value="85"></label>
  <label><input id="pumpAuto" type="checkbox" checked> 自動找角度（接頭不穿封底板、不高於外框、不穿豎板）</label>
  <h1 style="margin-top:12px">豎板（自己調位置）</h1>
  <label><input id="pOn" type="checkbox" checked> 顯示豎板</label>
  <label>前後位置 <span id="vPx"></span><input id="pX" type="range" min="-210" max="210" value="-16"></label>
  <label>左右位置 <span id="vPz"></span><input id="pZ" type="range" min="-440" max="440" value="-256"></label>
  <label>寬度 <span id="vPw"></span><input id="pW" type="range" min="20" max="880" value="213"></label>
  <label>高度 <span id="vPh"></span><input id="pH" type="range" min="10" max="300" value="134"></label>
  <label>底部離地 <span id="vPy"></span><input id="pY" type="range" min="0" max="300" value="111"></label>
  <label>厚度 <span id="vPt"></span><input id="pT" type="range" min="0.5" max="10" step="0.5" value="1.5"></label>
  <label>水平旋轉 <span id="vPr"></span><input id="pR" type="range" min="-180" max="180" value="90"></label>
  <label>豎板一體折出的底腳 <span id="vPf"></span><input id="pF" type="range" min="0" max="150" value="0"></label>
  <label>底腳／L 角鐵方向 <select id="pFd"><option value="1">往右（馬達那側）</option><option value="-1">往左（鍋爐那側）</option></select></label>
  <h1 style="margin-top:12px">豎板右側 L 角鐵（馬達側）</h1>
  <label><input id="aOn" type="checkbox" checked> 顯示 L 角鐵</label>
  <label>立邊高 <span id="vAh"></span><input id="aH" type="range" min="10" max="134" value="15"></label>
  <label>底邊長 <span id="vAf"></span><input id="aF" type="range" min="10" max="120" value="40"></label>
  <label>寬度 <span id="vAw"></span><input id="aW" type="range" min="10" max="213" value="170"></label>
  <label>厚度 <span id="vAt"></span><input id="aT" type="range" min="0.5" max="6" step="0.5" value="1.5"></label>
  <label><input id="mLow" type="checkbox" checked> 馬達不高於金色外框頂（自動往下降）</label>
  <label><input id="mAttach" type="checkbox" checked> 馬達鎖在豎板上（馬達左側貼齊豎板）</label>
  <label><input id="pSnap" type="checkbox"> 鎖在馬達左側（跟著馬達自動貼齊）</label>
  <button id="pCopy">複製目前數值</button>
  <div class="hint">左鍵拖曳＝旋轉　右鍵拖曳＝平移　滾輪＝縮放<br>點一下零件＝選取（亮綠色＋顯示編號尺寸）<br>要隱藏：選取後按「隱藏選取的零件」</div>
  <button id="bHideSel">隱藏選取的零件</button>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d2126);
const camera = new THREE.PerspectiveCamera(40, 1, 1, 20000);
const controls = new OrbitControls(camera, canvas);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.6));
const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(1, 2, 1.5); scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, 0.6); dl2.position.set(-1, -0.5, -1); scene.add(dl2);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const meta = await fetch('model.json').then(r => r.json());
const gz = await fetch('model.bin.gz').then(r => r.body.pipeThrough(new DecompressionStream('gzip')));
const buf = new Uint8Array(await new Response(gz).arrayBuffer());
const nPos = meta.nPos, nIdx = meta.nIdx, nV = nPos / 3;
const pos = new Float32Array(nPos), idx = new Uint32Array(nIdx);
let o = 0;
for (let c = 0; c < 3; c++) { let acc = 0; const lo = meta.lo[c], sc = meta.scale[c];
  for (let i = 0; i < nV; i++) { acc = (acc + (buf[o + i] | buf[o + nV + i] << 8)) & 65535; pos[i * 3 + c] = lo + acc * sc; } o += 2 * nV; }
{ const ev = new DataView(buf.buffer, o + 2 * nIdx); let e = 0, hw = -1;
  for (let i = 0; i < nIdx; i++) { let z = buf[o + i] | buf[o + nIdx + i] << 8; if (z === 65535) z = ev.getUint32(4 * e++, true);
    const v = hw + 1 - (z & 1 ? -(z + 1) / 2 : z / 2); idx[i] = v; if (v > hw) hw = v; } }
const group = new THREE.Group(); scene.add(group);
const plane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
const palette = [0xb8bec6, 0xc98a4a, 0xd4b45a, 0x8fa3b8, 0x9c9c9c, 0xcfd5db, 0x7d8a96, 0xbfa58a];
const meshes = [];
const bigVol = meta.parts.map(p => p[2] * p[3] * p[4]);
meta.parts.forEach((p, i) => {
  const [i0, n, sx, sy, sz] = p;
  const sub = idx.subarray(i0, i0 + n);
  let mn = Infinity, mx = -Infinity;
  for (let k = 0; k < sub.length; k++) { if (sub[k] < mn) mn = sub[k]; if (sub[k] > mx) mx = sub[k]; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos.slice(mn * 3, (mx + 1) * 3), 3));
  const loc = new Uint32Array(sub.length); for (let k = 0; k < sub.length; k++) loc[k] = sub[k] - mn;
  g.setIndex(new THREE.BufferAttribute(loc, 1)); g.computeVertexNormals(); g.computeBoundingBox();
  const thin = Math.min(sx, sy, sz) < 4 && Math.max(sx, sy, sz) > 150;
  const col = thin ? 0xc7ccd2 : palette[i % palette.length];
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: col, metalness: 0.35, roughness: 0.55, side: THREE.DoubleSide, clippingPlanes: [plane] }));
  m.userData = { i, size: [sx, sy, sz], big: Math.max(sx, sy, sz) > 400 && thin };
  group.add(m); meshes.push(m);
});
const box = new THREE.Box3().setFromObject(group);
const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
document.getElementById('size').textContent = `${Math.round(size.x)} × ${Math.round(size.y)} × ${Math.round(size.z)}`;
function fit() {
  const r = size.length() * 0.6;
  camera.position.copy(center).add(new THREE.Vector3(r * 0.9, r * 0.6, r * 1.2));
  controls.target.copy(center); controls.update();
}
fit();
const cut = document.getElementById('cut'), axisSel = document.getElementById('axis'), cutv = document.getElementById('cutv');
function applyCut() {
  const a = +axisSel.value; const lo = box.min.getComponent(a), hi = box.max.getComponent(a);
  const v = lo + (hi - lo) * cut.value / 1000;
  const n = new THREE.Vector3(); n.setComponent(a, -1);
  plane.normal.copy(n); plane.constant = v;
  cutv.textContent = `${Math.round(v - lo)} / ${Math.round(hi - lo)} mm`;
}
cut.oninput = applyCut; axisSel.onchange = applyCut; applyCut();
document.getElementById('xray').onchange = e => {
  meshes.forEach(m => { if (m.userData.big) { m.material.transparent = e.target.checked; m.material.opacity = e.target.checked ? 0.18 : 1; m.material.depthWrite = !e.target.checked; m.material.needsUpdate = true; } });
};
if (document.getElementById('bAll')) document.getElementById('bAll').onclick = () => { meshes.forEach(m => m.visible = true); cut.value = 1000; axisSel.value = 1; applyCut(); };
document.getElementById('bFit').onclick = fit;
document.getElementById('bHideSel').onclick = () => { const m = window.__sel; if (!m) return;
  m.material.emissive.setHex(0); m.visible = false; window.__sel = null;
  document.getElementById('info').textContent = `已隱藏零件（按「底座＋內部」可恢復）`; };
const BASE_HIDE = new Set([25, 185, 833, 834, 835, 836, 710, 712, 715, 716, 717, 718, 831, 832, 329]);
const isT = b => b.min.y >= 245 || b.max.y > 280;
const isDeck = b => b.max.y > 240 && b.min.y > 200 && (b.max.x - b.min.x) * (b.max.z - b.min.z) > 40000;
function baseView() {
  cut.value = 1000; axisSel.value = 1; applyCut();
  meshes.forEach(m => { const b = m.geometry.boundingBox; m.visible = !(isT(b) || isDeck(b) || BASE_HIDE.has(m.userData.i)); });
  camera.position.set(center.x + 650, 800, center.z + 750); controls.target.set(0, 100, 0); controls.update();
}
document.getElementById('bBase').onclick = baseView;
baseView();
const HOUSING_BOTTOM = 111, OLD_BOX = [0], OLD_FEET = [12,13,14,15,16,17,18,19,165,166,167,168,169,170,171,172,173,174,175,176];
const steel = new THREE.MeshStandardMaterial({ color: 0xc4c8cc, metalness: 0.75, roughness: 0.32 });
const redoGroup = new THREE.Group(); scene.add(redoGroup);
const origY = new Map(); meshes.forEach(m => origY.set(m, m.position.y));
const lowParts = meshes.filter(m => { const b = m.geometry.boundingBox;
  return b.min.y < HOUSING_BOTTOM - 5 && b.max.y > 0 && !OLD_BOX.includes(m.userData.i) && !OLD_FEET.includes(m.userData.i)
    && (b.max.x - b.min.x) < 480 && b.max.y < 281; });
function roundedBox(w, h, d, r) {
  const s = new THREE.Shape(); const x = -w / 2, z = -d / 2;
  s.moveTo(x + r, z); s.lineTo(x + w - r, z); s.quadraticCurveTo(x + w, z, x + w, z + r);
  s.lineTo(x + w, z + d - r); s.quadraticCurveTo(x + w, z + d, x + w - r, z + d);
  s.lineTo(x + r, z + d); s.quadraticCurveTo(x, z + d, x, z + d - r); s.lineTo(x, z + r); s.quadraticCurveTo(x, z, x + r, z);
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: true, bevelThickness: 3, bevelSize: 3, bevelSegments: 3 });
  g.rotateX(Math.PI / 2); return g;
}
const FRAME_IDS = [5, 6, 7, 669, 670, 671, 688, 689, 690, 729, 730];
let _hull = null;
function frameBottomHull() {
  if (_hull) return _hull;
  const pts = [];
  FRAME_IDS.forEach(i => { const p = meshes[i].geometry.attributes.position;
    for (let k = 0; k < p.count; k++) if (p.getY(k) < 116) pts.push([p.getX(k), p.getZ(k)]); });
  pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.slice().reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  _hull = lo.slice(0, -1).concat(up.slice(0, -1));
  return _hull;
}
const MOTOR_EXTRA = [164, 322, 323, 324, 328, 332, 337, 665, 666, 667];
const MOTOR = meshes.filter(m => { const b = m.geometry.boundingBox, i = m.userData.i;
  return MOTOR_EXTRA.includes(i) || (!FRAME_IDS.includes(i) && i !== 9 && b.min.x >= -210 && b.max.x <= 90 && b.min.z >= -385 && b.max.z <= -240 && b.min.y >= 40 && b.max.y < 300); });
const MOTOR_AXIS = new THREE.Vector3(-70.5, 117.5, -315);
const PUMP = (() => { const pb = meshes[164].geometry.boundingBox.clone().expandByScalar(20);
  return MOTOR.filter(m => ![156, 157, 158].includes(m.userData.i) && (m.userData.i === 164 || MOTOR_EXTRA.includes(m.userData.i) || m.geometry.boundingBox.intersectsBox(pb))); })();
const MOT_OFF = { dz: 0, dy: 0 };
const MOTOR_P = (() => { const bb = new THREE.Box3(); MOTOR.forEach(m => bb.union(m.geometry.boundingBox)); return bb.getCenter(new THREE.Vector3()); })();
function rebuild() {
  const on = document.getElementById('redo').checked;
  const L = +document.getElementById('sLen').value, H = +document.getElementById('sH').value, UP = +document.getElementById('sUp').value;
  document.getElementById('vLen').textContent = `${L} mm（原 880）`;
  document.getElementById('vH').textContent = `${H} mm（原 77）`;
  document.getElementById('vUp').textContent = `${UP} mm`;
  redoGroup.clear();
  meshes.forEach(m => { m.position.set(0, origY.get(m), 0); m.rotation.set(0, 0, 0); });
  OLD_BOX.concat(OLD_FEET).forEach(i => meshes[i].visible = !on && !BASE_HIDE.has(i));
  if (!on) return;
  const isMid = m => { const b = m.geometry.boundingBox;
    return b.min.z >= -L / 2 && b.max.z <= L / 2 && b.min.x >= -191 && b.max.x <= 191; };
  const live = lowParts.filter(m => m.visible);
  const mids = live.filter(isMid);
  const midLow = mids.length ? Math.min(...mids.map(m => m.geometry.boundingBox.min.y)) : Infinity;
  const midUp = Math.max(0, (HOUSING_BOTTOM - H + 1.5) - midLow);
  const outs = live.filter(m => !isMid(m));
  const outLow = outs.length ? Math.min(...outs.map(m => m.geometry.boundingBox.min.y)) : Infinity;
  const outUp = Math.max(UP, HOUSING_BOTTOM - outLow);
  lowParts.forEach(m => m.position.y = origY.get(m) + (isMid(m) ? midUp : outUp));
  document.getElementById('vUp').textContent = `${UP} mm → 實際 ${Math.round(outUp)} mm（不低於封底板）；中間零件上移 ${Math.round(midUp)} mm（貼齊底盒底面）`;
  window.__lift = { outUp, midUp, outLow, midLow };
  const deg = +document.getElementById('motorRot').value, th = deg * Math.PI / 180;
  document.getElementById('vMot').textContent = `${deg}°`;
  const rollDeg = +document.getElementById('motorRoll').value, phi = rollDeg * Math.PI / 180;
  document.getElementById('vRoll').textContent = `${rollDeg}°`;
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(phi, th, 0, 'YXZ'));
